services:
  scraping-api:
    build: .
    container_name: scraping-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - API_KEY=${API_KEY:?API_KEY must be set}
      - MAX_CONCURRENT_BROWSERS=${MAX_CONCURRENT_BROWSERS:-15}
      - PROXIES=${PROXIES:-}
    # Chromium needs more than the default 64MB of shared memory or it crashes
    # on pages with any real amount of content.
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
